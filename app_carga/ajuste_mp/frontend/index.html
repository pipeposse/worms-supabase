<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajuste de kg reales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Diseño alineado con el CSS global de la app (Inter + Plus Jakarta, indigo/violeta).
   Criterio: legibilidad de planta. Los números mandan, el color sólo significa algo
   (verde/ámbar/rojo = qué tan lejos está de la balanza) y los ceros se apagan para que
   no compitan con los valores que sí importan. Filas altas para usar con una tablet. */
:root{
  --bg:#fff; --bg2:#fafbff; --bg3:#f4f5fb; --ink:#0f172a; --mut:#64748b; --mut2:#a5aec0;
  --line:#e6e8f0; --line2:#d7dbe8; --brand:#4f46e5; --brand2:#7c3aed;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#9333ea 100%);
  --ok:#059669; --okbg:#d1fae5; --warn:#d97706; --warnbg:#fef3c7;
  --bad:#dc2626; --badbg:#fee2e2; --ed:#7c3aed; --edbg:#f3f0ff;
}
.dark{
  --bg:#0e1117; --bg2:#141922; --bg3:#1b212c; --ink:#e6edf3; --mut:#9aa7b4; --mut2:#5c6675;
  --line:#252c38; --line2:#333c4b; --brand:#818cf8; --brand2:#a78bfa;
  --ok:#4ade80; --okbg:#0f2e1e; --warn:#fbbf24; --warnbg:#382a08;
  --bad:#f87171; --badbg:#3a1414; --ed:#c4b5fd; --edbg:#221b3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-size:14px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
#app{padding:0 0 6px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 3px rgba(16,24,40,.05)}

/* ---------------------------------- barra ---------------------------------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
.bar h3{margin:0;font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:1.02rem;
  font-weight:800;letter-spacing:-.01em}
.bar .sub{color:var(--mut);font-size:.8rem;margin-top:2px}
.spacer{flex:1}
.estado{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 13px;
  font-size:.76rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.estado.d{background:var(--okbg);color:var(--ok)}
.estado.p{background:var(--edbg);color:var(--ed)}
.estado .pt{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.estado.p .pt{animation:lat 1.4s ease-in-out infinite}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}

/* --------------------------------- tabla ----------------------------------- */
.wrap{max-height:560px;min-height:120px;overflow:auto;overscroll-behavior:contain}
table{width:100%;border-collapse:separate;border-spacing:0;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
thead th{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1.5px solid var(--line2);
  padding:9px 7px;text-align:right;font-size:.66rem;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
thead th.l{text-align:left;padding-left:16px}
thead th.res{background:var(--bg3)}
tbody td{padding:0 7px;height:52px;border-bottom:1px solid var(--line);text-align:right;
  white-space:nowrap;font-size:.95rem}
tbody td.l{text-align:left;padding-left:16px}
tbody td.res{background:var(--bg2)}
thead th.res:first-of-type,tbody td.res:nth-last-child(4),tfoot td.res:nth-last-child(4){
  border-left:1px solid var(--line2)}
thead th.l,tbody td.l{min-width:150px;width:1%}
tbody tr:hover td{background:var(--bg3)}
tbody tr:hover td.res{background:var(--bg3);filter:brightness(.99)}
.desp{font-weight:700;font-size:.95rem;line-height:1.2}
.tit{width:100%;max-width:210px;height:30px;text-align:left;border:1.5px solid transparent;
  border-radius:8px;padding:0 7px;margin-left:-7px;background:transparent;font:inherit;
  font-size:.92rem;font-weight:700;color:var(--ink);transition:border-color .1s,background .1s}
.tit:hover{border-color:var(--line2);background:var(--bg)}
.tit:focus{border-color:var(--brand);background:var(--bg);outline:none;
  box-shadow:0 0 0 3.5px rgba(79,70,229,.14)}
.tit.ed{background:var(--edbg);color:var(--ed);border-color:var(--ed)}
.meta{color:var(--mut);font-size:.74rem;margin-top:2px;display:flex;align-items:center;gap:6px}
.tag{display:inline-block;background:var(--edbg);color:var(--ed);border-radius:5px;
  padding:0 6px;font-size:.66rem;font-weight:800;letter-spacing:.02em}

/* celdas editables: sin bordes hasta que las tocás, y el cero apagado */
.c{width:88px;height:38px;text-align:right;border:1.5px solid transparent;border-radius:9px;
  padding:0 9px;background:transparent;font:inherit;font-size:.95rem;font-weight:600;
  color:var(--ink);font-variant-numeric:tabular-nums;transition:border-color .1s,background .1s}
.c::placeholder{color:var(--mut2);font-weight:400}
.c:hover{border-color:var(--line2);background:var(--bg)}
.c:focus{border-color:var(--brand);background:var(--bg);outline:none;
  box-shadow:0 0 0 3.5px rgba(79,70,229,.14)}
.c.dif{background:var(--edbg);color:var(--ed);font-weight:700}
.c.ed{background:var(--edbg);color:var(--ed);font-weight:800;border-color:var(--ed)}
.c.cero{color:var(--mut2);font-weight:400}

.mez{font-weight:800;font-size:1rem;font-family:'Plus Jakarta Sans','Inter',sans-serif}
.bal{color:var(--mut);font-size:.92rem}
.chip{display:inline-block;border-radius:8px;padding:3px 8px;font-size:.83rem;font-weight:800;
  min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.chip.g{background:var(--okbg);color:var(--ok)}
.chip.y{background:var(--warnbg);color:var(--warn)}
.chip.r{background:var(--badbg);color:var(--bad)}
.chip.n{color:var(--mut2)}

.acc{display:flex;gap:4px;align-items:center;justify-content:flex-end;padding-right:10px}
.ib{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);
  cursor:pointer;font-size:.95rem;line-height:1;display:inline-flex;align-items:center;
  justify-content:center;transition:.12s;color:var(--ink);padding:0}
.ib:hover{border-color:var(--brand);background:var(--bg3);transform:translateY(-1px)}
.ib:active{transform:translateY(0)}
.ib:disabled{opacity:.3;cursor:not-allowed;transform:none}
.ib.go{border-color:#c7cbf5;color:var(--brand);font-weight:700}

tfoot td{position:sticky;bottom:0;background:var(--bg3);border-top:2px solid var(--line2);
  padding:11px 7px;text-align:right;font-weight:800;font-size:.95rem}
tfoot td.l{text-align:left;padding-left:16px;font-family:'Plus Jakarta Sans','Inter',sans-serif}
tfoot td.res{background:var(--bg3)}

/* ---------------------------------- pie ------------------------------------ */
.ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 18px;
  background:var(--bg2);border-top:1px solid var(--line)}
.btn{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:9px 15px;
  cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap;min-height:42px;
  font-family:inherit;color:var(--ink);transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{transform:translateY(-1px);border-color:#c7cbf5;
  box-shadow:0 6px 16px -8px rgba(79,70,229,.45)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.p{background:var(--grad);border:0;color:#fff;font-weight:700;
  box-shadow:0 8px 20px -10px rgba(124,58,237,.7)}
.btn.p:hover{filter:brightness(1.06)}
.btn.p:disabled{background:var(--bg3);color:var(--mut);box-shadow:none;opacity:1;
  border:1px solid var(--line2)}
.ayuda{color:var(--mut);font-size:.76rem;line-height:1.7}
kbd{background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-size:.7rem;font-family:inherit;font-weight:700;color:var(--mut)}
.aviso{display:flex;gap:9px;align-items:flex-start;padding:11px 18px;font-size:.83rem;
  background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-weight:500}
.vacio{padding:34px;text-align:center;color:var(--mut2);font-size:.9rem}
.wrap::-webkit-scrollbar{width:10px;height:10px}
.wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;
  border:2px solid var(--bg)}
.wrap::-webkit-scrollbar-track{background:transparent}
@media (max-width:1200px){ .ayuda{display:none} }
@media (max-width:900px){ .c{width:72px} tbody td{height:48px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------------------- protocolo Streamlit --------------------------- */
var READY = false;
function post(t, o) { var m = {isStreamlitMessage: true, type: t};
  for (var k in o) m[k] = o[k]; window.parent.postMessage(m, "*"); }
function ready() { if (READY) return; READY = true;
  post("streamlit:componentReady", {apiVersion: 1}); }
var _h = -1;
function fit() { var h = Math.ceil(document.getElementById("app").getBoundingClientRect().height) + 4;
  if (h !== _h && h > 0) { _h = h; post("streamlit:setFrameHeight", {height: h}); } }
function send(v) { post("streamlit:setComponentValue", {value: v, dataType: "json"}); }

/* --------------------------------- estado ---------------------------------- */
var S = {rev: -1, seq: 0, mps: [], rows: [], titulo: "", ed: {}, edT: {}, undo: [], nota: null};
/* S.ed  = { "<idFila>|<mp>": tn }     -> celdas de TN que el usuario tocó.
   S.edT = { "<idFila>": "titulo" }    -> renombres de despacho pendientes.
   Nada de esto viaja al servidor hasta que se aprieta Guardar: por eso no hay
   ni un rerun mientras se edita. */

function nf(v, d) { if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("es-AR", {minimumFractionDigits: d === undefined ? 2 : d,
                                            maximumFractionDigits: d === undefined ? 2 : d}); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function esc(s) { return String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function K(id, mp) { return id + "|" + mp; }
var LS = "worms_ajuste_mp";

/* valor vigente de una celda: lo editado si se tocó, si no lo que vino del servidor */
function val(r, mp) { var k = K(r.id, mp);
  if (S.ed.hasOwnProperty(k)) return S.ed[k];
  return (r.v && r.v[mp] !== undefined && r.v[mp] !== null) ? num(r.v[mp]) : 0; }
function formulado(r, mp) { return (r.f && r.f[mp] !== undefined && r.f[mp] !== null) ? num(r.f[mp]) : 0; }
function tocada(r, mp) { return S.ed.hasOwnProperty(K(r.id, mp)); }
function titulo(r) { return S.edT.hasOwnProperty(r.id) ? S.edT[r.id] : r.desp; }
function tituloCambiado(r) { return S.edT.hasOwnProperty(r.id)
  && String(S.edT[r.id]).trim() !== "" && String(S.edT[r.id]).trim() !== String(r.desp); }
function mezcla(r) { var t = 0; S.mps.forEach(function (m) { t += val(r, m); }); return t; }
function dif(r) { return mezcla(r) - num(r.bal); }
function tocadaFila(r) { for (var i = 0; i < S.mps.length; i++)
  if (tocada(r, S.mps[i])) return true; return false; }
function sem(r) {
  var b = num(r.bal); if (!(b > 0)) return "n";
  if (!r.aj && !tocadaFila(r)) return "n";      // todavía es el formulado: sin color
  var p = Math.abs(dif(r)) / b * 100;
  return p <= 0.3 ? "g" : (p <= 1.5 ? "y" : "r");
}
function nCambios() { var n = 0; for (var k in S.ed) n++;
  S.rows.forEach(function (r) { if (tituloCambiado(r)) n++; }); return n; }

/* ------------------------------- persistencia ------------------------------- */
function guardarLocal() { try {
  window.localStorage.setItem(LS, JSON.stringify({rev: S.rev, ed: S.ed, edT: S.edT}));
} catch (e) {} }
function leerLocal() { try {
  var o = JSON.parse(window.localStorage.getItem(LS) || "null");
  if (o && o.rev === S.rev && (o.ed || o.edT)) return {ed: o.ed || {}, edT: o.edT || {}};
} catch (e) {} return null; }
function borrarLocal() { try { window.localStorage.removeItem(LS); } catch (e) {} }

/* -------------------------------- acciones --------------------------------- */
function snap() { S.undo.push(JSON.stringify({ed: S.ed, edT: S.edT}));
  if (S.undo.length > 50) S.undo.shift(); }
function deshacer() { if (!S.undo.length) return;
  var o = JSON.parse(S.undo.pop()); S.ed = o.ed || {}; S.edT = o.edT || {};
  guardarLocal(); draw(); }
function setCelda(r, mp, v, sinSnap) { if (!sinSnap) snap();
  S.ed[K(r.id, mp)] = Math.max(0, num(v)); guardarLocal(); }
/* Volver a lo formulado tiene DOS significados según de dónde venga la fila:
   - si el despacho todavía no tiene kg reales guardados, alcanza con olvidar la
     edición local (la celda vuelve sola a lo formulado);
   - si YA los tiene, hay que dejar la celda EN el valor formulado y marcarla como
     pendiente, porque lo que hay que mandarle al servidor es un borrado del ajuste.
     Sin esto, tocar ↩︎ en una fila ajustada no dejaba nada para guardar y el botón
     quedaba deshabilitado: la reversión no se podía aplicar nunca. */
function revertirCelda(r, mp) { snap();
  if (r.aj) S.ed[K(r.id, mp)] = formulado(r, mp);
  else delete S.ed[K(r.id, mp)];
  guardarLocal(); }
function revertirFila(r) { snap();
  S.mps.forEach(function (m) {
    if (r.aj) S.ed[K(r.id, m)] = formulado(r, m);
    else delete S.ed[K(r.id, m)];
  });
  delete S.edT[r.id];
  guardarLocal(); }
/* Deja la fila EXACTAMENTE en lo que pesó la balanza, repartiendo la diferencia
   entre las materias primas en la misma proporción que tienen ahora. Es la
   operación que se hace todo el tiempo: el total tiene que dar lo de portería. */
function cerrarFila(r, sinSnap) {
  var b = num(r.bal); if (!(b > 0)) return false;
  var tot = mezcla(r); if (!(tot > 0)) return false;
  if (!sinSnap) snap();
  var f = b / tot, acum = 0, ult = null;
  S.mps.forEach(function (m) { var v = val(r, m); if (v <= 0) return;
    var nv = Math.round(v * f * 100) / 100; S.ed[K(r.id, m)] = nv; acum += nv; ult = m; });
  if (ult !== null) {  // el redondeo se le carga a la última: el total cierra exacto
    S.ed[K(r.id, ult)] = Math.round((S.ed[K(r.id, ult)] + (b - acum)) * 100) / 100;
    if (S.ed[K(r.id, ult)] < 0) S.ed[K(r.id, ult)] = 0;
  }
  guardarLocal(); return true;
}
function cerrarTodas() { snap(); var n = 0;
  S.rows.forEach(function (r) { if (cerrarFila(r, true)) n++; });
  S.nota = n ? ("Se cerraron " + n + " despacho(s) contra la balanza. Revisá y guardá.")
             : "Ninguno de estos despachos tiene kg pesados en portería todavía.";
  draw(); }
function descartar() { snap(); S.ed = {}; S.edT = {}; borrarLocal(); S.nota = null; draw(); }

function guardar() {
  var cam = [];
  for (var k in S.ed) {
    var p = k.split("|"), id = p[0], mp = p.slice(1).join("|");
    var r = S.rows.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!r) continue;
    var v = S.ed[k];
    // volver EXACTO a lo formulado se manda como null: borra el ajuste en la base
    if (!r.aj && Math.abs(v - formulado(r, mp)) < 0.005) continue;
    cam.push({id: Number(id), mp: mp,
              tn: (r.aj && Math.abs(v - formulado(r, mp)) < 0.005) ? null : v});
  }
  var tits = [];
  S.rows.forEach(function (r) {
    if (tituloCambiado(r)) tits.push({id: Number(r.id), titulo: String(S.edT[r.id]).trim()});
  });
  if (!cam.length && !tits.length) { S.nota = "No hay nada distinto para guardar."; draw(); return; }
  S.seq++;
  send({action: "save", rev: S.rev, seq: S.seq, cambios: cam, titulos: tits});
  S.nota = "Guardando " + (cam.length + tits.length) + " cambio(s)…";
  draw();
}
/* --------------------------------- pintado --------------------------------- */
function filaHTML(r, i) {
  var m = mezcla(r), d = dif(r), sm = sem(r), b = num(r.bal);
  var tds = S.mps.map(function (mp) {
    var v = val(r, mp), fo = formulado(r, mp);
    var cls = tocada(r, mp) ? "ed" : (Math.abs(v - fo) > 0.005 ? "dif" : "");
    if (!cls && v <= 0) cls = "cero";        // los ceros no compiten con los valores
    var ti = "Formulado: " + nf(fo) + " TN";
    if (cls === "ed") ti += " · editado, sin guardar";
    else if (cls === "dif") ti += " · kg reales ya guardados";
    return '<td><input class="c ' + cls + '" data-r="' + i + '" data-m="' + esc(mp) +
      '" value="' + (v > 0 ? nf(v) : "") + '" title="' + esc(ti) +
      '" inputmode="decimal" placeholder="0,00"></td>';
  }).join("");
  return '<tr data-r="' + i + '">' +
    '<td class="l"><input class="tit' + (tituloCambiado(r) ? " ed" : "") +
      '" data-t="' + i + '" value="' + esc(titulo(r)) + '" maxlength="80" ' +
      'title="El nombre del despacho: escribí acá para renombrarlo (se guarda con Guardar)">' +
      '<div class="meta">' + esc(r.fecha) + ' · ' + (r.cont || 0) + ' cont.' +
      (r.aj ? ' <span class="tag">KG REALES</span>' : '') + '</div></td>' +
    tds +
    '<td class="res mez">' + nf(m) + '</td>' +
    '<td class="res bal">' + (b > 0 ? nf(b) : "—") + '</td>' +
    '<td class="res"><span class="chip ' + sm + '">' +
      (b > 0 ? (d >= 0 ? "+" : "") + nf(d) : "—") + '</span></td>' +
    '<td class="res"><div class="acc">' +
      '<button class="ib go" data-cerrar="' + i + '"' + (b > 0 ? "" : " disabled") +
      ' title="Cerrar contra la balanza: reparte la diferencia entre las materias primas ' +
      'para que el total dé exactamente los ' + nf(b) + ' TN que pesó portería">⚖</button>' +
      '<button class="ib" data-rev="' + i + '" title="Volver esta fila a lo formulado">↩</button>' +
    '</div></td></tr>';
}
function pieHTML() {
  var tm = S.mps.map(function (mp) { var t = 0;
    S.rows.forEach(function (r) { t += val(r, mp); }); return t; });
  var tot = tm.reduce(function (a, b) { return a + b; }, 0);
  var tb = 0; S.rows.forEach(function (r) { tb += num(r.bal); });
  var td = tot - tb;
  var hay = S.rows.some(function (r) { return r.aj || tocadaFila(r); });
  var scls = (tb > 0 && hay) ? (Math.abs(td) / tb * 100 <= 0.3 ? "g"
                       : (Math.abs(td) / tb * 100 <= 1.5 ? "y" : "r")) : "n";
  return '<tr><td class="l">TOTAL SEMANA</td>' +
    tm.map(function (t) { return '<td>' + nf(t) + '</td>'; }).join("") +
    '<td class="res mez">' + nf(tot) + '</td>' +
    '<td class="res bal">' + (tb > 0 ? nf(tb) : "—") + '</td>' +
    '<td class="res"><span class="chip ' + scls + '">' +
      (tb > 0 ? (td >= 0 ? "+" : "") + nf(td) : "—") + '</span></td>' +
    '<td class="res"></td></tr>';
}
function draw() {
  var n = nCambios();
  var ncols = S.mps.length + 5;
  document.getElementById("app").innerHTML =
   '<div class="card">' +
    '<div class="bar"><div><h3>Kg reales por materia prima</h3>' +
      '<div class="sub">' + esc(S.titulo) + ' · ' + S.rows.length + ' despacho(s) · ' +
      'se edita al instante, <b>sin recargar la página</b></div></div>' +
      '<span class="spacer"></span>' +
      '<span class="estado ' + (n ? "p" : "d") + '"><span class="pt"></span>' +
        (n ? n + (n === 1 ? " cambio sin guardar" : " cambios sin guardar") : "todo guardado") +
      '</span></div>' +
    (S.nota ? '<div class="aviso"><span>⚠️</span><span>' + esc(S.nota) + '</span></div>' : "") +
    '<div class="wrap"><table><thead><tr>' +
      '<th class="l">Despacho</th>' +
      S.mps.map(function (m) { return '<th>' + esc(m) + '</th>'; }).join("") +
      '<th class="res">Mezcla</th><th class="res">Balanza</th><th class="res">Dif.</th>' +
      '<th class="res"></th>' +
      '</tr></thead><tbody>' +
      (S.rows.length ? S.rows.map(filaHTML).join("")
        : '<tr><td colspan="' + ncols + '"><div class="vacio">No hay despachos en esta ' +
          'semana.</div></td></tr>') +
      '</tbody><tfoot>' + pieHTML() + '</tfoot></table></div>' +
    '<div class="ft">' +
      '<button class="btn p" id="b_save"' + (n ? "" : " disabled") + '>Guardar' +
        (n ? " " + n + " cambio" + (n === 1 ? "" : "s") : "") + '</button>' +
      '<button class="btn" id="b_cerrar_todo">⚖ Cerrar todas contra balanza</button>' +
      '<button class="btn" id="b_undo"' + (S.undo.length ? "" : " disabled") + '>↩ Deshacer</button>' +
      '<button class="btn" id="b_desc"' + (n ? "" : " disabled") + '>Descartar</button>' +
      '<span class="spacer"></span>' +
      '<span class="ayuda"><kbd>Tab</kbd> recorre la grilla · <kbd>↑</kbd><kbd>↓</kbd> ' +
        'misma columna · <kbd>Esc</kbd> vuelve la celda a lo formulado · ' +
        '<kbd>Ctrl</kbd>+<kbd>Z</kbd> deshacer · se puede pegar desde Excel' +
      '</span></div>' +
   '</div>';
  wire(); fit();
}
/* repinta lo derivado SIN tocar los inputs: por eso se puede tipear sin perder el foco */
function paint() {
  S.rows.forEach(function (r, i) {
    var tr = document.querySelector('tr[data-r="' + i + '"]'); if (!tr) return;
    var tds = tr.children, base = 1 + S.mps.length;
    var m = mezcla(r), d = dif(r), b = num(r.bal);
    tds[base].textContent = nf(m);
    var ch = tds[base + 2].firstChild;
    if (ch) { ch.textContent = b > 0 ? (d >= 0 ? "+" : "") + nf(d) : "—";
              ch.className = "chip " + sem(r); }
    var ti = tr.querySelector(".tit");
    if (ti && document.activeElement !== ti) {
      ti.value = titulo(r); ti.className = "tit" + (tituloCambiado(r) ? " ed" : ""); }
    S.mps.forEach(function (mp, j) {
      var inp = tds[1 + j].firstChild; if (!inp) return;
      var v = val(r, mp), fo = formulado(r, mp);
      var cls = tocada(r, mp) ? "ed" : (Math.abs(v - fo) > 0.005 ? "dif" : "");
      if (!cls && v <= 0) cls = "cero";
      inp.className = "c " + cls;
      if (document.activeElement !== inp) inp.value = v > 0 ? nf(v) : "";
    });
  });
  var tf = document.querySelector("tfoot"); if (tf) tf.innerHTML = pieHTML();
  var n = nCambios();
  var p = document.querySelector(".estado");
  if (p) { p.className = "estado " + (n ? "p" : "d");
           p.innerHTML = '<span class="pt"></span>' +
             (n ? n + (n === 1 ? " cambio sin guardar" : " cambios sin guardar")
                : "todo guardado"); }
  var bs = document.getElementById("b_save");
  if (bs) { bs.disabled = !n;
            bs.textContent = "Guardar" + (n ? " " + n + " cambio" + (n === 1 ? "" : "s") : ""); }
  var bd = document.getElementById("b_desc"); if (bd) bd.disabled = !n;
  var bu = document.getElementById("b_undo"); if (bu) bu.disabled = !S.undo.length;
}
/* --------------------------------- eventos --------------------------------- */
function foco(i, j) {
  var tr = document.querySelector('tr[data-r="' + i + '"]'); if (!tr) return false;
  var inp = tr.children[1 + j] && tr.children[1 + j].firstChild;
  if (!inp) return false;
  inp.focus(); inp.select(); inp.scrollIntoView({block: "nearest"}); return true;
}
function wire() {
  var app = document.getElementById("app");
  app.onclick = function (e) {
    var el = e.target;
    var c = el.closest("[data-cerrar]");
    if (c) { var r = S.rows[parseInt(c.getAttribute("data-cerrar"), 10)];
      snap(); if (!cerrarFila(r, true)) S.nota = "Ese despacho todavía no tiene kg de balanza.";
      draw(); return; }
    var v = el.closest("[data-rev]");
    if (v) { revertirFila(S.rows[parseInt(v.getAttribute("data-rev"), 10)]); draw(); return; }
    if (el.id === "b_save") { guardar(); return; }
    if (el.id === "b_cerrar_todo") { cerrarTodas(); return; }
    if (el.id === "b_undo") { deshacer(); return; }
    if (el.id === "b_desc") { descartar(); return; }
  };
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains("tit")) {
      var rr = S.rows[parseInt(el.getAttribute("data-t"), 10)];
      if (rr) { S.edT[rr.id] = el.value;
        if (String(el.value).trim() === String(rr.desp)) delete S.edT[rr.id];
        el.className = "tit" + (tituloCambiado(rr) ? " ed" : "");
        guardarLocal(); paint(); }
      return;
    }
    if (!el.classList || !el.classList.contains("c")) return;
    var i = parseInt(el.getAttribute("data-r"), 10), mp = el.getAttribute("data-m");
    // se acepta coma o punto decimal y se ignoran los separadores de miles
    var raw = el.value.replace(/[^\d.,-]/g, "");
    var pt = raw.lastIndexOf("."), cm = raw.lastIndexOf(",");
    if (cm > pt) raw = raw.replace(/\./g, "").replace(",", ".");
    else raw = raw.replace(/,/g, "");
    setCelda(S.rows[i], mp, raw, true);
    paint();
  });
  app.addEventListener("focusin", function (e) {
    if (e.target.classList && (e.target.classList.contains("c")
        || e.target.classList.contains("tit"))) snap();
  });
  app.addEventListener("blur", function (e) {
    var el = e.target; if (!el.classList || !el.classList.contains("c")) return;
    var i = parseInt(el.getAttribute("data-r"), 10), mp = el.getAttribute("data-m");
    var v = val(S.rows[i], mp); el.value = v > 0 ? nf(v) : "";
  }, true);
  app.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault(); deshacer(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault(); guardar(); return; }
    var el = e.target;
    if (el.classList && el.classList.contains("tit")) {
      if (e.key === "Escape") { e.preventDefault();
        var rr = S.rows[parseInt(el.getAttribute("data-t"), 10)];
        if (rr) { delete S.edT[rr.id]; el.value = rr.desp; el.className = "tit";
                  guardarLocal(); paint(); }
        el.blur(); }
      else if (e.key === "Enter") { e.preventDefault(); el.blur(); }
      return;
    }
    if (!el.classList || !el.classList.contains("c")) return;
    var i = parseInt(el.getAttribute("data-r"), 10), j = S.mps.indexOf(el.getAttribute("data-m"));
    if (e.key === "Enter" || e.key === "ArrowDown") { e.preventDefault(); foco(i + 1, j); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (i > 0) foco(i - 1, j); }
    else if (e.key === "Escape") { e.preventDefault();
      revertirCelda(S.rows[i], el.getAttribute("data-m")); paint(); el.blur(); }
    else if (e.key === "Tab") {                    // Tab recorre la grilla entera
      e.preventDefault();
      var nj = j + (e.shiftKey ? -1 : 1), ni = i;
      if (nj >= S.mps.length) { nj = 0; ni = i + 1; }
      if (nj < 0) { nj = S.mps.length - 1; ni = i - 1; }
      if (ni >= 0) foco(ni, nj);
    }
  });
  // pegar una fila de Excel: los valores caen en las columnas a partir de la celda
  app.addEventListener("paste", function (e) {
    var el = e.target; if (!el.classList || !el.classList.contains("c")) return;
    var txt = (e.clipboardData || window.clipboardData).getData("text") || "";
    if (!/[\t\n]/.test(txt)) return;                 // un solo valor: comportamiento normal
    e.preventDefault(); snap();
    var i0 = parseInt(el.getAttribute("data-r"), 10),
        j0 = S.mps.indexOf(el.getAttribute("data-m"));
    txt.replace(/\r/g, "").split("\n").forEach(function (lin, di) {
      if (!lin.trim()) return;
      lin.split("\t").forEach(function (cel, dj) {
        var r = S.rows[i0 + di], mp = S.mps[j0 + dj];
        if (!r || !mp) return;
        var s2 = cel.replace(/[^\d.,-]/g, "");
        var pt = s2.lastIndexOf("."), cm = s2.lastIndexOf(",");
        s2 = cm > pt ? s2.replace(/\./g, "").replace(",", ".") : s2.replace(/,/g, "");
        if (s2 !== "") setCelda(r, mp, s2, true);
      });
    });
    draw();
  });
}

/* --------------------------- mensajes de Streamlit -------------------------- */
function onRender(ev) {
  var d = ev.data; if (!d || d.type !== "streamlit:render") return;
  var a = d.args || {};
  if (d.theme && d.theme.base) document.body.className = d.theme.base === "dark" ? "dark" : "";
  S.mps = a.mps || []; S.titulo = a.titulo || "";
  S.rows = a.rows || [];
  var nueva = (num(a.rev) !== S.rev);
  if (nueva) {
    // rev nueva = el servidor mandó datos nuevos (se guardó, cambió la semana o los
    // filtros): recién acá se pisa lo local. El eco de lo propio nunca llega, porque
    // mientras se edita no se manda nada.
    S.rev = num(a.rev); S.undo = []; S.nota = null;
    var rec = leerLocal();
    if (rec && (Object.keys(rec.ed).length || Object.keys(rec.edT).length)) {
      S.ed = rec.ed; S.edT = rec.edT;
      S.nota = "Se recuperaron " + (Object.keys(rec.ed).length + Object.keys(rec.edT).length) +
               " cambio(s) sin guardar de este navegador. Revisalos y guardá, o tocá Descartar.";
    } else { S.ed = {}; S.edT = {}; borrarLocal(); }
  }
  draw();
}
window.addEventListener("message", function (ev) {
  try { onRender(ev); } catch (err) {
    document.getElementById("app").innerHTML =
      '<div class="card"><div class="msg">⚠️ La grilla no pudo dibujarse: ' +
      esc(err && err.message) + '</div></div>'; fit(); }
});
window.addEventListener("resize", fit);
new MutationObserver(fit).observe(document.getElementById("app"), {childList: true, subtree: true});
try {
  window.parent.addEventListener("beforeunload", function (e) {
    if (nCambios()) { e.preventDefault(); e.returnValue = ""; }
  });
} catch (e) {}
ready(); fit();
</script>
</body>
</html>
