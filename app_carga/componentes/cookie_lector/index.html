<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
/* SOL-0056 · Lee las cookies de sesión de WORMS en el NAVEGADOR y se las pasa a la app.
   En Streamlit Community Cloud el proxy filtra las cookies del request y st.context.cookies
   llega vacío: por eso la sesión se perdía al refrescar. Protocolo de componentes de
   Streamlit sin librerías: componentReady → (render) → setComponentValue. */
(function () {
  function send(type, data) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
    window.parent.postMessage(msg, "*");
  }
  function leer() {
    var c = "";
    try { c = window.parent.document.cookie || ""; } catch (e) { }
    if (!c) { try { c = document.cookie || ""; } catch (e) { } }
    var out = {};
    c.split(";").forEach(function (p) {
      var i = p.indexOf("=");
      if (i > 0) {
        var k = p.slice(0, i).trim(), v = p.slice(i + 1).trim();
        try { v = decodeURIComponent(v); } catch (e) { }
        out[k] = v;
      }
    });
    return out;
  }
  var enviado = false;
  function enviar() {
    if (enviado) return;
    enviado = true;
    var ck = leer();
    send("streamlit:setFrameHeight", { height: 0 });
    send("streamlit:setComponentValue", {
      value: { s: ck["worms_session"] || "", sec: ck["worms_section"] || "" },
      dataType: "json"
    });
  }
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") { enviar(); }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
